name: OrangeFox - kuntao_row (private build)

# Private single-repo build for Lenovo P2a42 (kuntao_row).
# This repo's root IS the device tree (BoardConfig.mk lives here).
# The workflow syncs the OrangeFox manifest, copies this tree in, and builds.
# Nothing is pushed anywhere — artifacts stay in this repo's Actions run.

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox manifest branch (9.0 recommended for this 2016 device)'
        required: true
        default: '9.0'
        type: choice
        options:
          - '9.0'
          - '11.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: tree

      - name: Clean up disk
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build environment
        run: |
          sudo apt update
          git clone --depth=1 https://gitlab.com/OrangeFox/misc/scripts ofox-scripts
          cd ofox-scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox sources (shallow)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/fox"
          cd "${GITHUB_WORKSPACE}/fox"
          git config --global user.name "ofox-builder"
          git config --global user.email "ofox-builder@local"
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_${{ inputs.MANIFEST_BRANCH }}
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)

      - name: Place kuntao_row device tree
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/fox/device/lenovo/kuntao_row"
          # copy everything from the checked-out tree except git metadata and this workflow
          cp -r "${GITHUB_WORKSPACE}/tree/." "${GITHUB_WORKSPACE}/fox/device/lenovo/kuntao_row/"
          rm -rf "${GITHUB_WORKSPACE}/fox/device/lenovo/kuntao_row/.git" \
                 "${GITHUB_WORKSPACE}/fox/device/lenovo/kuntao_row/.github"
          ls "${GITHUB_WORKSPACE}/fox/device/lenovo/kuntao_row"

      - name: Build recoveryimage
        working-directory: ${{ github.workspace }}/fox
        run: |
          source build/envsetup.sh
          lunch omni_kuntao_row-eng
          mka recoveryimage -j$(nproc)

      - name: Collect outputs
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp -v "${GITHUB_WORKSPACE}/fox/out/target/product/kuntao_row/"*.img "${GITHUB_WORKSPACE}/out/" || true
          cp -v "${GITHUB_WORKSPACE}/fox/out/target/product/kuntao_row/"OrangeFox*.zip "${GITHUB_WORKSPACE}/out/" || true
          ls -lh "${GITHUB_WORKSPACE}/out"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-kuntao_row-${{ inputs.MANIFEST_BRANCH }}
          path: out/
          if-no-files-found: error
